# [인스턴스 데이터 — 사람마다 다름. 이 스킬을 다른 사람이 가져다 쓰면
#  이 파일에 그 사람의 회사로 채운다.]
#
# 레거시 components/project/*.md의 `org:` 필드 값 → 트리 company 디렉터리 id 매핑.
# extract.py가 레거시와 트리를 병합할 때 이 표를 거쳐서 같은 회사를 하나로 합친다.
# 마이그레이션이 끝나 --legacy-dir를 더 이상 안 쓰게 되면 이 파일도 필요 없어진다
# — 비워둬도 extract.py는 정상 동작한다(현재 이 저장소는 마이그레이션이 끝나서
# 비어있다).
#
# 예시:
# 회사A: company-a
# 회사B: company-b
